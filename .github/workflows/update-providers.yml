name: Auto update providers data
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (jq, curl)
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Run update script to build data/providers.json
        env:
          AWS_JSON_URL: ${{ secrets.AWS_JSON_URL }}
          AZURE_JSON_URL: ${{ secrets.AZURE_JSON_URL }}
          GCP_JSON_URL: ${{ secrets.GCP_JSON_URL }}
          ORACLE_JSON_URL: ${{ secrets.ORACLE_JSON_URL }}
          ALIBABA_JSON_URL: ${{ secrets.ALIBABA_JSON_URL }}
        run: bash scripts/update-providers.sh

      - name: Commit and push changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update providers.json [skip ci]"
          file_pattern: "data/providers.json"
          branch: ${{ github.ref_name }}
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
