<!--
  File: ai-tools.html
  Summary: Dynamic comparison page for the top 5 AI tools in 2025.
           Loads data from ai-tools.json and displays each tool's details.
           Includes a link to return to the homepage.
  Usage: Linked from index.html; shows AI tool differentiation.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Top 5 AI Tools Comparison</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS for responsive design and styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <!-- Page title -->
    <h1 class="mb-4 text-center">Top 5 AI Tools in 2025</h1>
    <!-- Container for dynamic AI tool cards -->
    <div id="ai-tools" class="row g-4"></div>
    <!-- Back to home button -->
    <div class="mt-4 text-center">
      <a href="index.html" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>
  <!-- Script to fetch and display AI tools from ai-tools.json -->
  <script>
    fetch('ai-tools.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('ai-tools');
        data.tools.forEach(tool => {
          container.innerHTML += `
            <div class="col-md-6 col-lg-4">
              <div class="card h-100 shadow-sm">
                <div class="card-body">
                  <h5 class="card-title">${tool.name}</h5>
                  <p class="card-text">${tool.description}</p>
                  <ul class="list-group list-group-flush mb-2">
                    <li class="list-group-item"><strong>Provider:</strong> ${tool.provider}</li>
                    <li class="list-group-item"><strong>Strength:</strong> ${tool.strength}</li>
                    <li class="list-group-item"><strong>Weakness:</strong> ${tool.weakness}</li>
                  </ul>
                  <a href="${tool.link}" class="btn btn-primary" target="_blank">Learn More</a>
                </div>
              </div>
            </div>
          `;
        });
      });
  </script>
</body>
</html>
