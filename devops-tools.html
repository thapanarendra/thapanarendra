<!--
  File: devops-tools.html
  Summary: Dynamic comparison page for major DevOps tools.
           Loads data from devops-tools.json and displays each tool's details.
           Includes a link to return to the homepage.
  Usage: Linked from index.html; shows DevOps tool differentiation.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevOps Tools Comparison</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4 text-center">DevOps Tools Comparison</h1>
    <!-- Dynamic cards will be loaded here -->
    <div id="devops-tools" class="row g-4"></div>
    <div class="mt-4 text-center">
      <a href="index.html" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>
  <!-- Loads and displays DevOps tools from JSON -->
  <script>
    fetch('devops-tools.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('devops-tools');
        data.tools.forEach(tool => {
          container.innerHTML += `
            <div class="col-md-6 col-lg-4">
              <div class="card h-100 shadow-sm">
                <div class="card-body">
                  <h5 class="card-title">${tool.name}</h5>
                  <p class="card-text">${tool.description}</p>
                  <ul class="list-group list-group-flush mb-2">
                    <li class="list-group-item"><strong>Strength:</strong> ${tool.strength}</li>
                    <li class="list-group-item"><strong>Weakness:</strong> ${tool.weakness}</li>
                  </ul>
                  <a href="${tool.link}" class="btn btn-primary" target="_blank">Learn More</a>
                </div>
              </div>
            </div>
          `;
        });
      });
  </script>
</body>
</html>
