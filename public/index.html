// filepath: public/index.html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CloudCompare — dynamic multi‑cloud</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>CloudCompare</h1>
    <p class="subtitle">Compare compute, network, storage, database and more — live</p>
    <div class="controls">
      <select id="regionFilter"><option value="global">All regions</option></select>
      <button id="refreshBtn">Refresh now</button>
      <span id="status" class="status">Loading…</span>
    </div>
  </header>

  <main>
    <section id="cards" class="grid"></section>

    <section class="table-section">
      <h2>Side-by-side comparison</h2>
      <div id="tableWrap"></div>
    </section>

    <section class="chart-section">
      <h2>Compute price comparison</h2>
      <canvas id="priceChart" height="120"></canvas>
    </section>
  </main>

  <footer>
    <small>Data from edge aggregator — updates automatically. Built by Thapanarendra.</small>
  </footer>

  <script src="assets/js/app.js" defer></script>
</body>
</html>
