<!--
  File: security-platforms.html
  Summary: Dynamic comparison page for major security platforms.
           Loads data from security-platforms.json and displays each platform's details.
           Includes a link to return to the homepage.
  Usage: Linked from index.html; shows security platform differentiation.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Platforms Comparison</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS for styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4 text-center">Security Platforms Comparison</h1>
    <!-- Dynamic cards will be loaded here -->
    <div id="security-platforms" class="row g-4"></div>
    <div class="mt-4 text-center">
      <a href="index.html" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>
  <!-- Loads and displays security platforms from JSON -->
  <script>
    fetch('security-platforms.json')
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('security-platforms');
        data.platforms.forEach(platform => {
          container.innerHTML += `
            <div class="col-md-6 col-lg-4">
              <div class="card h-100 shadow-sm">
                <div class="card-body">
                  <h5 class="card-title">${platform.name}</h5>
                  <p class="card-text">${platform.description}</p>
                  <ul class="list-group list-group-flush mb-2">
                    <li class="list-group-item"><strong>Strength:</strong> ${platform.strength}</li>
                    <li class="list-group-item"><strong>Weakness:</strong> ${platform.weakness}</li>
                  </ul>
                  <a href="${platform.link}" class="btn btn-primary" target="_blank">Learn More</a>
                </div>
              </div>
            </div>
          `;
        });
      });
  </script>
</body>
</html>
